# Test-classpath defaults, loaded in every @SpringBootTest next to the main
# application.yml (Spring Boot merges application.properties and application.yml
# from the same location; .properties wins on conflicts). This supplies what
# application-local.yml provides for dev runs, so test contexts boot without a
# profile. Datasource and Redis come from Testcontainers in each test class.
# Nothing here is a real secret and no test talks to S3.

app.jwt.secret=test-only-jwt-secret-that-is-comfortably-longer-than-32-chars
app.jwt.issuer=autoparts-api-test
app.jwt.access-ttl=PT1H

app.s3.endpoint=http://localhost:9000
app.s3.region=us-east-1
app.s3.access-key=test
app.s3.secret-key=test
app.s3.bucket=autoparts-test
app.s3.listings-bucket=autoparts-listings
app.s3.listings-public-base=http://localhost:9000/autoparts-listings
app.s3.catalog-bucket=autopart-diagrams
app.s3.catalog-public-base=http://localhost:9000/autopart-diagrams

app.admin.phones=
