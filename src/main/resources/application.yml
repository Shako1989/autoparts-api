spring:
  application:
    name: autoparts-api
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      # Redis only backs caches (vPIC VIN decodes). Fail fast so a down Redis
      # degrades to uncached calls instead of stalling requests.
      connect-timeout: 2s
      timeout: 2s

server:
  port: 8080
  forward-headers-strategy: framework
  error:
    include-message: always

app:
  cors:
    allowed-origins: http://localhost:5173
  vpic:
    # NHTSA vPIC VIN decoder (free, public domain, rate-controlled).
    # Backs GET /api/v1/catalog/vin/{vin}; decodes are cached in Redis.
    base-url: https://vpic.nhtsa.dot.gov/api
    connect-timeout: 3s
    read-timeout: 10s
    cache-ttl: 30d

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
